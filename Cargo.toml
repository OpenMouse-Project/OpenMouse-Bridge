[package]
name = "openmouse-bridge"
version = "1.0.0"
edition = "2024"
description = "Local native HID and desktop companion for the OpenMouse control panel"
license = "MIT"

[build-dependencies]
winresource = "0.1"

[dependencies]
anyhow = "1.0"
axum = { version = "0.8", features = ["ws"] }
directories = "6.0"
# macos-shared-device: macOS otherwise seizes every opened device, which freezes
# the cursor when the opened interface is a mouse's pointer collection.
hidapi = { version = "2.6.6", features = ["macos-shared-device"] }
notify-rust = "4.11"
png = "0.18"
semver = "1.0"
sha2 = "0.10"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sysinfo = "0.37"
tokio = { version = "1.47", features = ["fs", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tower-http = { version = "0.6", features = ["cors", "set-header", "trace"] }
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
zip = { version = "9.0", default-features = false, features = ["deflate"] }

[target.'cfg(any(target_os = "windows", target_os = "macos", target_os = "linux"))'.dependencies]
# The window is GPUI; see docs/gpui-migration.md.
gpui-kit = "0.7"
# The profile-switch overlay draws its banner on the CPU: skrifa outlines, the
# vello_cpu rasterizer, and epaint_default_fonts for fallback glyphs.
epaint_default_fonts = "0.36.1"
skrifa = { version = "0.44", default-features = false, features = ["std"] }
vello_cpu = { version = "0.1", default-features = false, features = ["std", "u8_pipeline"] }

[target.'cfg(any(target_os = "windows", target_os = "macos"))'.dependencies]
# No default features: they link libxdo (via muda) for menu items Bridge never
# uses. Linux has no tray yet, so this is not built there.
tray-icon = { version = "0.24.2", default-features = false }
# The native window behind a GPUI window, to hide just the panel to the tray.
raw-window-handle = "0.6"

[target.'cfg(target_os = "linux")'.dependencies]
# X11 overlay banner and foreground-window lookup. Pure Rust, no system
# libraries.
x11rb = "0.13"
# Virtual keyboard and mouse for the button listener (/dev/uinput).
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.4"
objc2-app-kit = { version = "0.3.2", default-features = false, features = [
  "NSApplication",
  "NSBitmapImageRep",
  "NSColor",
  "NSControl",
  "NSEvent",
  "NSGraphics",
  "NSImage",
  "NSImageRep",
  "NSImageView",
  "NSPanel",
  "NSResponder",
  "NSRunningApplication",
  "NSScreen",
  "NSSound",
  "NSView",
  "NSWindow",
  "NSWorkspace",
] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["NSArray", "NSData", "NSGeometry", "NSString"] }
# Posts the key and button events the button listener presses.
objc2-core-foundation = { version = "0.3.2", default-features = false, features = ["std", "CFCGTypes"] }
objc2-core-graphics = { version = "0.3.2", default-features = false, features = ["std", "CGEvent", "CGEventTypes", "CGRemoteOperation"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_Media",
  "Win32_Media_Audio",
  "Win32_System_LibraryLoader",
  "Win32_Storage_FileSystem",
  "Win32_System_Registry",
  "Win32_System_Threading",
  "Win32_UI_HiDpi",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }

[profile.release]
# Keeps the binary small: the bridge package the older updaters download has to
# compress under their 16 MiB archive-metadata budget.
strip = true

[patch.crates-io]
# Keep GPUI 0.3.9; correct source-over alpha in its macOS Metal compositor.
# Same patch OpenMouse Desktop carries (vendored from there).
gpui-pre-apple = { path = "vendor/gpui-pre-apple" }
