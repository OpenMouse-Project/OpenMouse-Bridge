[package]
name = "openmouse-bridge"
version = "0.1.0"
edition = "2024"
description = "Local companion service for OpenMouse game detection and battery alerts"
license = "MIT"

[dependencies]
anyhow = "1.0"
axum = "0.8"
directories = "6.0"
notify-rust = "4.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sysinfo = "0.37"
tokio = { version = "1.47", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tower-http = { version = "0.6", features = ["cors", "set-header", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
