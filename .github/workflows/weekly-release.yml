name: Weekly stable release

# Friday 1pm in Edmonton, which no longer changes its clocks: MST, UTC-7,
# is 20:00 UTC all year.
on:
  schedule:
    - cron: '0 20 * * 5'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: weekly-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check automation token
        env:
          PROTOCOL_UPDATE_TOKEN: ${{ secrets.PROTOCOL_UPDATE_TOKEN }}
        run: |
          if [ -z "$PROTOCOL_UPDATE_TOKEN" ]; then
            echo 'Set the PROTOCOL_UPDATE_TOKEN repository secret: a tag pushed with the default token would not start the release workflow.' >&2
            exit 1
          fi
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.PROTOCOL_UPDATE_TOKEN }}
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Prepare the release
        id: prepare
        run: |
          last="$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -1)"
          test -n "$last"
          echo "Last stable release: $last"
          git log --reverse --no-merges --format=%s "$last..HEAD" > "$RUNNER_TEMP/subjects.txt"
          version="$(node .github/scripts/weekly-release.mjs "$last" "$RUNNER_TEMP/subjects.txt" | sed -n 's/^version=//p')"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Commit and tag
        if: steps.prepare.outputs.version != ''
        env:
          VERSION: ${{ steps.prepare.outputs.version }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Cargo.toml Cargo.lock CHANGELOG.md
          git commit -m "chore(release): $VERSION"
          git tag "v$VERSION"
          # One push, so the tag only exists if the version commit landed. The
          # tag starts Bridge Stable Release.
          git push --atomic origin HEAD:main "v$VERSION"
      - name: Nothing to release
        if: steps.prepare.outputs.version == ''
        run: echo 'No user-facing changes since the last stable release; skipping this week.'
