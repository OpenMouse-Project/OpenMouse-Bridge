name: Bridge CI

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  # Keep in sync with release.yml's NATIVE_HID_NODE_VERSION.
  NATIVE_HID_NODE_VERSION: v24.18.1

jobs:
  check:
    name: Check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux HID dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libudev-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Check formatting
        if: runner.os == 'Linux'
        run: cargo fmt --check
      - name: Test
        run: cargo test --locked
      - name: Lint
        run: cargo clippy --locked --all-targets -- -D warnings

  windows-build:
    name: Windows release artifact
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Build
        run: cargo build --release --locked
      - name: Prepare native-hid (deps + bundled Node.js runtime)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          npm install --prefix native-hid --omit=dev
          # Trim node-hid's other-platform prebuilt bindings — this archive
          # only ever runs on win32-x64.
          Get-ChildItem native-hid/node_modules/node-hid/prebuilds -Directory |
            Where-Object { $_.Name -ne "HID-win32-x64" } |
            Remove-Item -Recurse -Force
          Invoke-WebRequest -Uri "https://nodejs.org/dist/$env:NATIVE_HID_NODE_VERSION/node-$env:NATIVE_HID_NODE_VERSION-win-x64.zip" -OutFile node.zip
          Expand-Archive node.zip -DestinationPath node-extracted
          New-Item -ItemType Directory -Force -Path native-hid/node | Out-Null
          Copy-Item "node-extracted/node-$env:NATIVE_HID_NODE_VERSION-win-x64/node.exe" native-hid/node/node.exe
      - name: Package
        shell: pwsh
        run: |
<<<<<<< HEAD
          Compress-Archive -Path target/release/openmouse-bridge.exe,README.md,driver -DestinationPath openmouse-bridge-windows-x64.zip
=======
          Compress-Archive -Path target/release/openmouse-bridge.exe,README.md,native-hid -DestinationPath openmouse-bridge-windows-x64.zip
>>>>>>> upstream
          (Get-FileHash openmouse-bridge-windows-x64.zip -Algorithm SHA256).Hash.ToLower() + "  openmouse-bridge-windows-x64.zip" | Set-Content openmouse-bridge-windows-x64.zip.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: openmouse-bridge-windows-x64
          path: |
            openmouse-bridge-windows-x64.zip
            openmouse-bridge-windows-x64.zip.sha256
          if-no-files-found: error

  linux-build:
    name: Linux release artifact
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build
        run: cargo build --release --locked
      # The WinUSB driver folder is Windows-only, so it is not bundled here.
      - name: Package
        run: |
          tar -czf openmouse-bridge-linux-x64.tar.gz README.md -C target/release openmouse-bridge
          sha256sum openmouse-bridge-linux-x64.tar.gz > openmouse-bridge-linux-x64.tar.gz.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: openmouse-bridge-linux-x64
          path: |
            openmouse-bridge-linux-x64.tar.gz
            openmouse-bridge-linux-x64.tar.gz.sha256
          if-no-files-found: error

  macos-build:
    name: macOS release artifact
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - name: Build universal binary
        run: |
          cargo build --release --locked --target aarch64-apple-darwin
          cargo build --release --locked --target x86_64-apple-darwin
          lipo -create \
            target/aarch64-apple-darwin/release/openmouse-bridge \
            target/x86_64-apple-darwin/release/openmouse-bridge \
            -output openmouse-bridge
          chmod +x openmouse-bridge
      # The WinUSB driver folder is Windows-only, so it is not bundled here.
      - name: Package
        run: |
          zip openmouse-bridge-macos-universal.zip openmouse-bridge README.md
          shasum -a 256 openmouse-bridge-macos-universal.zip > openmouse-bridge-macos-universal.zip.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: openmouse-bridge-macos-universal
          path: |
            openmouse-bridge-macos-universal.zip
            openmouse-bridge-macos-universal.zip.sha256
          if-no-files-found: error

  dev-release:
    name: Publish rolling development release
    needs: [windows-build, linux-build, macos-build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Publish dev-build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view dev-build --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release delete dev-build --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes
          fi
          gh release create dev-build \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "Development build" \
            --notes "Automatic Windows, Linux, and macOS build from main at $GITHUB_SHA." \
            artifacts/*
