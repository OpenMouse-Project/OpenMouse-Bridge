name: Bridge CI

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  # The rolling dev-build job force-pushes a tag; GITHUB_TOKEN needs this
  # too whenever that ref's commits touch .github/workflows/*.yml, or the
  # push is rejected ("without `workflows` permission") even though
  # contents: write already covers ordinary ref pushes.
  workflows: write

env:
  # Keep in sync with release.yml's NATIVE_HID_NODE_VERSION.
  NATIVE_HID_NODE_VERSION: v24.18.1

jobs:
  check:
    name: Check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux HID dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libudev-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Check formatting
        if: runner.os == 'Linux'
        run: cargo fmt --check
      - name: Test
        run: cargo test --locked
      - name: Lint
        run: cargo clippy --locked --all-targets -- -D warnings

  windows-build:
    name: Windows release artifact
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Build
        run: cargo build --release --locked
      - name: Prepare native-hid (deps + bundled Node.js runtime)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          npm install --prefix native-hid --omit=dev
          # Trim node-hid's other-platform prebuilt bindings — this archive
          # only ever runs on win32-x64.
          Get-ChildItem native-hid/node_modules/node-hid/prebuilds -Directory |
            Where-Object { $_.Name -ne "HID-win32-x64" } |
            Remove-Item -Recurse -Force
          Invoke-WebRequest -Uri "https://nodejs.org/dist/$env:NATIVE_HID_NODE_VERSION/node-$env:NATIVE_HID_NODE_VERSION-win-x64.zip" -OutFile node.zip
          Expand-Archive node.zip -DestinationPath node-extracted
          New-Item -ItemType Directory -Force -Path native-hid/node | Out-Null
          Copy-Item "node-extracted/node-$env:NATIVE_HID_NODE_VERSION-win-x64/node.exe" native-hid/node/node.exe
      - name: Package
        shell: pwsh
        run: |
          Compress-Archive -Path target/release/openmouse-bridge.exe,README.md,native-hid -DestinationPath openmouse-bridge-windows-x64.zip
          (Get-FileHash openmouse-bridge-windows-x64.zip -Algorithm SHA256).Hash.ToLower() + "  openmouse-bridge-windows-x64.zip" | Set-Content openmouse-bridge-windows-x64.zip.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: openmouse-bridge-windows-x64
          path: |
            openmouse-bridge-windows-x64.zip
            openmouse-bridge-windows-x64.zip.sha256
          if-no-files-found: error
      - name: Publish rolling development release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if (gh release view dev-build 2>$null) {
            gh release delete dev-build --cleanup-tag --yes
          }
          git tag -f dev-build
          git push origin dev-build --force
          gh release create dev-build --prerelease --title "Development build" --notes "Automatic Windows build from main at $env:GITHUB_SHA." openmouse-bridge-windows-x64.zip openmouse-bridge-windows-x64.zip.sha256
