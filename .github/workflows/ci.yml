name: Bridge CI

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  # Keep in sync with release.yml's NATIVE_HID_NODE_VERSION.
  NATIVE_HID_NODE_VERSION: v24.18.1

jobs:
  check:
    name: Check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux HID and GUI dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libudev-dev libgtk-3-dev libayatana-appindicator3-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libssl-dev libgl1-mesa-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Check formatting
        if: runner.os == 'Linux'
        run: cargo fmt --check
      - name: Test installer script
        if: runner.os == 'Linux'
        run: |
          bash -n install-linux.sh
          bash install-linux.sh --help
          bash -c 'export HOME=/root OPENMOUSE_INSTALL_SOURCED=1; source ./install-linux.sh; D=$(mktemp -d); write_udev_rule "$D/rule"; bodies=$(grep -c "SUBSYSTEM" "$D/rule"); vids=$(printf "%s" "$VENDOR_IDS" | wc -w); [ "$bodies" = "$vids" ] || exit 1; write_autostart "$D/a.desktop" "/opt/x/b"; grep -q "Exec=\"/opt/x/b\"" "$D/a.desktop"; for pm in apt dnf pacman zypper apk; do pm_packages "$pm" | grep -q curl || exit 1; done; rm -rf "$D"'

  windows-build:
    name: Windows release artifact
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: native-hid/package-lock.json
      - name: Build
        run: cargo build --release --locked
      - name: Prepare native-hid (deps + bundled Node.js runtime)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          npm install --prefix native-hid --omit=dev
          # Trim node-hid's other-platform prebuilt bindings — this archive
          # only ever runs on win32-x64.
          Get-ChildItem native-hid/node_modules/node-hid/prebuilds -Directory |
            Where-Object { $_.Name -ne "HID-win32-x64" } |
            Remove-Item -Recurse -Force
          Invoke-WebRequest -Uri "https://nodejs.org/dist/$env:NATIVE_HID_NODE_VERSION/node-$env:NATIVE_HID_NODE_VERSION-win-x64.zip" -OutFile node.zip
          Expand-Archive node.zip -DestinationPath node-extracted
          New-Item -ItemType Directory -Force -Path native-hid/node | Out-Null
          Copy-Item "node-extracted/node-$env:NATIVE_HID_NODE_VERSION-win-x64/node.exe" native-hid/node/node.exe
      - name: Package
        shell: pwsh
        run: |
          Compress-Archive -Path target/release/openmouse-bridge.exe,README.md,native-hid -DestinationPath openmouse-bridge-windows-x64.zip
          (Get-FileHash openmouse-bridge-windows-x64.zip -Algorithm SHA256).Hash.ToLower() + "  openmouse-bridge-windows-x64.zip" | Set-Content openmouse-bridge-windows-x64.zip.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: openmouse-bridge-windows-x64
          path: |
            openmouse-bridge-windows-x64.zip
            openmouse-bridge-windows-x64.zip.sha256
          if-no-files-found: error
      - name: Publish rolling development release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Deleting the release and pushing the tag race: gh may still see
          # the old release when create runs (the tag push recreates the
          # association server-side). Poll until the release is really gone.
          gh release delete dev-build --cleanup-tag --yes
          for ($i = 0; $i -lt 30; $i++) {
            try { gh release view dev-build 2>$null | Out-Null; Start-Sleep -Seconds 10 }
            catch { break }
          }
          git tag -f dev-build
          git push origin dev-build --force
          for ($i = 0; $i -lt 30; $i++) {
            try { gh release create dev-build --prerelease --title "Development build" --notes "Automatic Windows build from main at $env:GITHUB_SHA." openmouse-bridge-windows-x64.zip openmouse-bridge-windows-x64.zip.sha256; break }
            catch { Start-Sleep -Seconds 10 }
          }
          gh release view dev-build --json tagName | Out-Null
